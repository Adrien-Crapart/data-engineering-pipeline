[project]
name = "weather-pipeline-ingestion"
version = "1.0.0"
description = "DLT ingestion pipeline for weather data"
requires-python = ">=3.12"

dependencies = [
    "dlt[filesystem,parquet]>=1.0.0",
    "s3fs>=2024.0.0",
    "pyarrow>=17.0.0",
    "minio>=7.2.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "prometheus_client>=0.20.0",
]
