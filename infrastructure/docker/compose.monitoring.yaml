name: data-engineering-pipeline

networks:
  pipeline-network:
    driver: bridge

services:
  # ── StatsD Exporter (Airflow metrics → Prometheus) ──
  statsd-exporter:
    image: prom/statsd-exporter:v0.27.2
    container_name: statsd_exporter_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    command:
      - "--statsd.listen-udp=:8125"
      - "--web.listen-address=:9102"
      - "--statsd.mapping-config=/tmp/statsd_mapping.yml"
    ports:
      - "9102:9102"
      - "8125:8125/udp"
    volumes:
      - ./monitoring/statsd-exporter/statsd_mapping.yml:/tmp/statsd_mapping.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9102/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── Prometheus ──
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.wal-compression"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.00"
        reservations:
          memory: 768M
    depends_on:
      statsd-exporter:
        condition: service_started

  # ── Prometheus Pushgateway (pipeline metrics) ──
  prometheus-pushgateway:
    image: prom/pushgateway:v1.11.2
    container_name: prometheus_pushgateway_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9091/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M

  # ── Alertmanager ──
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - ./monitoring/alertmanager:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    depends_on:
      mailhog:
        condition: service_started

  # ── Node Exporter (host metrics) ──
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node_exporter_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9100/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M

  # ── Docker Exporter (container metrics) ──
  docker-exporter:
    container_name: docker_exporter_monitoring
    build:
      context: ./monitoring/docker-exporter
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "9417:9417"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.15"

  # ── Grafana ──
  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/airflow-overview.json
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailhog:1025
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_FROM_ADDRESS: grafana@weather-pipeline.local
      GF_SMTP_FROM_NAME: Grafana Alerting
      GF_INSTALL_PLUGINS: grafana-postgresql-datasource
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.75"
        reservations:
          memory: 256M
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  # ── Loki (log aggregation) ──
  loki:
    image: grafana/loki:3.4.2
    container_name: loki_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.75"
        reservations:
          memory: 256M

  # ── Promtail (log collector) ──
  promtail:
    image: grafana/promtail:3.4.2
    container_name: promtail_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    depends_on:
      loki:
        condition: service_started

  # ── MailHog (email testing) ──
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "8025:8025"
      - "1025:1025"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── Metabase (Business Intelligence) ──
  metabase:
    image: metabase/metabase:v0.51.7
    container_name: metabase_monitoring
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER:-metabase_user}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase_password}
      MB_DB_HOST: postgres
      # Java heap settings
      JAVA_OPTS: -Xmx1g -Xms512m
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.00"
        reservations:
          memory: 768M
          cpus: "0.50"

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  metabase-data:
