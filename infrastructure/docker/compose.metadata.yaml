services:
  openmetadata-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.6
    profiles:
      - openmetadata
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - openmetadata-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
        reservations:
          memory: 512M
    networks:
      - pipeline-network

  openmetadata-server:
    image: openmetadata/server:1.6.2
    profiles:
      - openmetadata
    environment:
      OPENMETADATA_CLUSTER_NAME: data-engineering-pipeline
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USE_SSL: "false"
      DB_USER: openmetadata
      DB_USER_PASSWORD: ${OM_PG_PASSWORD:-openmetadata}
      DB_SCHEMA_NAME: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: openmetadata-elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      AUTHENTICATION_PROVIDER: no-auth
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
      PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL: "300"
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      PIPELINE_SERVICE_CLIENT_SSL_CERT_PATH: ""
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
    ports:
      - "8585:8585"
    depends_on:
      postgres:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8585/api/v1/system/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.00"
        reservations:
          memory: 1G
    networks:
      - pipeline-network

  openmetadata-ingestion:
    image: openmetadata/ingestion:1.6.2
    profiles:
      - openmetadata
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://openmetadata:${OM_PG_PASSWORD:-openmetadata}@postgres:5432/openmetadata_airflow_db
      OPENMETADATA_SERVER_HOST: openmetadata-server
      OPENMETADATA_SERVER_PORT: 8585
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-airflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      DB_NAME: ${POSTGRES_DB:-weather_db}
    ports:
      - "8086:8080"
    depends_on:
      openmetadata-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.50"
        reservations:
          memory: 512M
    networks:
      - pipeline-network

volumes:
  openmetadata-es-data:

networks:
  pipeline-network:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-data-engineering-pipeline}_pipeline-network
