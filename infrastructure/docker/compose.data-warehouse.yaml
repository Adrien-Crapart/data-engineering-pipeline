name: data-engineering-pipeline

networks:
  pipeline-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_data_warehouse
    restart: unless-stopped
    networks:
      - pipeline-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/00_create_roles.sql:/docker-entrypoint-initdb.d/00_create_roles.sql
      - ./infrastructure/scripts/01_create_databases.sql:/docker-entrypoint-initdb.d/01_create_databases.sql
      - ./infrastructure/scripts/02_enable_extensions.sql:/docker-entrypoint-initdb.d/02_enable_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: redis_data_warehouse
    restart: unless-stopped
    networks:
      - pipeline-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M

volumes:
  postgres-data:
  redis-data:
