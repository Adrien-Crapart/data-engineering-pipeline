x-airflow-common: &airflow-common
  build:
    context: ./orchestration/
    dockerfile: Dockerfile
  networks:
    - pipeline-network
  env_file:
    - .env
  environment: &airflow-common-env
    # Secrets and deployment-specific vars (not in airflow.cfg)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow_user}:${AIRFLOW_DB_PASSWORD:-airflow_password}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow_user}:${AIRFLOW_DB_PASSWORD:-airflow_password}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-RMU3ZDFjNzk4YjI0M2I4OTdhZGE5NmU0Nzc2ZWEyNDQ=}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleQ==}
    # Enable BasicAuth for the API server (useful for local/dev deployments)
    AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # AWS/MinIO credentials
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    AWS_DEFAULT_REGION: us-east-1
    AWS_ENDPOINT_URL_S3: http://minio:9000
    # Project context
    COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-data-engineering-pipeline}
    PROJECT_ROOT: ${PROJECT_ROOT:-.}
    PYTHONPATH: /opt/airflow
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # SMTP for monitoring DAG emails
    SMTP_HOST: mailhog
    SMTP_PORT: "1025"
    ALERT_FROM: monitoring@weather-pipeline.local
    ALERT_TO: admin@weather-pipeline.local
    # Monitoring DAG API credentials
    AIRFLOW_API_USER: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
    AIRFLOW_API_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/plugins:/opt/airflow/plugins
    - ./orchestration/scripts:/opt/airflow/scripts
    - ./monitoring:/opt/airflow/monitoring
    - ./orchestration/config:/opt/airflow/config
    - ./transformations:/opt/airflow/dbt

name: data-engineering-pipeline

networks:
  pipeline-network:
    driver: bridge

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init_orchestration
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins}
        /entrypoint airflow version
        sed -i 's/\r$//' /opt/airflow/scripts/airflow_config.sh 2>/dev/null || true
        chmod +x /opt/airflow/scripts/airflow_config.sh 2>/dev/null || true
        bash /opt/airflow/scripts/airflow_config.sh import
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow_api_server_orchestration
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
        reservations:
          memory: 512M
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler_orchestration
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.00"
        reservations:
          memory: 1536M
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor_orchestration
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.00"
        reservations:
          memory: 768M
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker_orchestration
    command: celery worker
    user: "50000:0"
    group_add:
      - "1001"
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/plugins:/opt/airflow/plugins
      - ./orchestration/scripts:/opt/airflow/scripts
      - ./orchestration/config:/opt/airflow/config
      - ./monitoring:/opt/airflow/monitoring
      - ./transformations:/opt/airflow/dbt
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 5G
          cpus: "2.00"
        reservations:
          memory: 2560M
    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer_orchestration
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.50"
        reservations:
          memory: 512M
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  flower:
    <<: *airflow-common
    container_name: flower_orchestration
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
    depends_on:
      airflow-init:
        condition: service_completed_successfully
