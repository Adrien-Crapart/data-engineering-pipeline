# OpenMetadata services - separated from core stack for lightweight startup.
# Usage: docker compose -f docker-compose.yml -f docker-compose.openmetadata.yml up -d
#
# OpenMetadata provides: data catalog, lineage, profiling, glossary, metadata governance.

services:
  openmetadata-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${OM_MYSQL_ROOT_PASSWORD:-openmetadata}
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: openmetadata
      MYSQL_PASSWORD: ${OM_MYSQL_PASSWORD:-openmetadata}
    ports:
      - "3306:3306"
    volumes:
      - openmetadata-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pipeline-network

  openmetadata-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - openmetadata-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - pipeline-network

  openmetadata-server:
    image: openmetadata/server:1.12.1
    environment:
      OPENMETADATA_CLUSTER_NAME: weather-platform
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      DB_USE_SSL: "false"
      DB_USER: openmetadata
      DB_USER_PASSWORD: ${OM_MYSQL_PASSWORD:-openmetadata}
      DB_SCHEMA_NAME: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: openmetadata-elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      AUTHENTICATION_PROVIDER: no-auth
    ports:
      - "8585:8585"
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8585/api/v1/system/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - pipeline-network

volumes:
  openmetadata-mysql-data:
  openmetadata-es-data:

networks:
  pipeline-network:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-weather-pipeline}_pipeline-network
