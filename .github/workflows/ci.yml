name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  sql-lint:
    name: SQL Lint (SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQLFluff
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-duckdb

      - name: SQLFluff lint
        working-directory: transformations/dbt
        run: sqlfluff lint models/ --dialect duckdb
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pyyaml requests python-dotenv minio prometheus_client polars pyarrow duckdb
          pip install -e ".[dev]" || true

      - name: Run unit tests
        env:
          OPENWEATHER_API_KEY: test_key_for_ci
          WEATHER_CITIES: Paris,Lyon
          POSTGRES_HOST: localhost
        run: pytest tests/unit/ -v --tb=short -x

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: airflow
            dockerfile: infrastructure/docker/Dockerfile.airflow
            tag: weather-pipeline-airflow:ci
          - image: dlt
            dockerfile: infrastructure/docker/Dockerfile.dlt
            tag: weather-pipeline-dlt:ci
          - image: dbt
            dockerfile: infrastructure/docker/Dockerfile.dbt
            tag: weather-pipeline-dbt:ci
          - image: soda
            dockerfile: infrastructure/docker/Dockerfile.soda
            tag: weather-pipeline-soda:ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dbt-compile:
    name: dbt Compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install dbt-duckdb dbt-core duckdb

      - name: dbt deps
        working-directory: transformations/dbt
        run: dbt deps --profiles-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: weather_db
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow

      - name: dbt compile (dry-run)
        working-directory: transformations/dbt
        run: dbt compile --profiles-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: weather_db
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
        continue-on-error: true

  contract-validation:
    name: Contract Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate contract YAML files
        run: |
          python -c "
          import yaml, sys, glob
          errors = 0
          for f in glob.glob('contracts/*_contract.yaml'):
              try:
                  with open(f) as fh:
                      data = yaml.safe_load(fh)
                  assert 'contract' in data, f'Missing top-level contract key in {f}'
                  assert 'schema' in data['contract'], f'Missing schema in {f}'
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'FAIL: {f} - {e}')
                  errors += 1
          sys.exit(errors)
          "

  smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: |
          docker build -f infrastructure/docker/Dockerfile.airflow -t weather-pipeline-airflow:ci .
          docker build -f infrastructure/docker/Dockerfile.dlt -t weather-pipeline-dlt:ci .
          docker build -f infrastructure/docker/Dockerfile.dbt -t weather-pipeline-dbt:ci .
          docker build -f infrastructure/docker/Dockerfile.soda -t weather-pipeline-soda:ci .

      - name: Start core services
        run: |
          docker compose --env-file .env.example \
            -f infrastructure/docker/compose.data-warehouse.yaml \
            -f infrastructure/docker/compose.data-lake.yaml \
            -p ci-smoke-test up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if docker compose -p ci-smoke-test exec -T postgres pg_isready -U airflow 2>/dev/null; then
              echo "PostgreSQL is ready after $i attempts"
              break
            fi
            sleep 2
          done

          echo "Waiting for MinIO..."
          for i in $(seq 1 20); do
            if docker compose -p ci-smoke-test exec -T minio curl -sf http://localhost:9000/minio/health/live 2>/dev/null; then
              echo "MinIO is ready after $i attempts"
              break
            fi
            sleep 2
          done

      - name: Verify services
        run: |
          docker compose -p ci-smoke-test ps
          docker compose -p ci-smoke-test exec -T postgres psql -U airflow -d weather_db -c "SELECT 1 AS health_check;"

      - name: Tear down
        if: always()
        run: docker compose -p ci-smoke-test down -v
