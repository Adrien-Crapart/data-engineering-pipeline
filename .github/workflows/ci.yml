name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pyyaml requests python-dotenv minio prometheus_client
          pip install -e ".[dev]" || true

      - name: Run tests
        env:
          OPENWEATHER_API_KEY: test_key_for_ci
          WEATHER_CITIES: Paris,Lyon
          POSTGRES_HOST: localhost
        run: pytest tests/ -v --tb=short -x

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Airflow image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile \
            -t weather-pipeline:ci \
            .

  dbt-compile:
    name: dbt Compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install dbt-postgres dbt-core

      - name: dbt deps
        working-directory: transformations/dbt
        run: dbt deps --profiles-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: weather_db
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow

      - name: dbt compile (dry-run)
        working-directory: transformations/dbt
        run: dbt compile --profiles-dir .
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: weather_db
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
        continue-on-error: true

  contract-validation:
    name: Contract Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate contract YAML files
        run: |
          python -c "
          import yaml, sys, glob
          errors = 0
          for f in glob.glob('contracts/*_contract.yaml'):
              try:
                  with open(f) as fh:
                      data = yaml.safe_load(fh)
                  assert 'contract' in data, f'Missing top-level contract key in {f}'
                  assert 'schema' in data['contract'], f'Missing schema in {f}'
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'FAIL: {f} - {e}')
                  errors += 1
          sys.exit(errors)
          "
