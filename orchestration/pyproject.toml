[project]
name = "weather-pipeline-airflow"
version = "1.0.0"
description = "Airflow orchestration dependencies for the weather data pipeline"
requires-python = ">=3.12"

dependencies = [
    "apache-airflow-providers-celery>=3.10.0",
    "apache-airflow-providers-fab>=3.0.0",
    "apache-airflow-providers-amazon>=9.0.0",
    "apache-airflow-providers-docker>=3.0.0",
    "apache-airflow-providers-openlineage>=2.0.0",
    "apache-airflow-providers-postgres>=6.0.0",
    "apache-airflow-providers-slack>=9.0.0",
    "apache-airflow-providers-smtp>=1.0.0",
    "astronomer-cosmos[dbt-postgres,dbt-duckdb]>=1.8.0",
    "asyncpg>=0.30.0",
    "confluent-kafka>=2.6.0",
    "prometheus_client>=0.20.0",
    "pendulum>=3.0.0",
    "jinja2>=3.1.0",
]
