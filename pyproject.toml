[project]
name = "weather-data-pipeline"
version = "1.0.0"
description = "Production-grade weather data pipeline: API → ingestion → storage → transformation → quality → orchestration"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Adrien"},
]
readme = "README.md"

dependencies = [
    "apache-airflow-providers-fab>=3.0.0",
    "dlt[postgres]>=1.0.0",
    "dbt-postgres>=1.9.0",
    "soda-core-postgres>=3.3.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "minio>=7.2.0",
    "pyyaml>=6.0",
    "prometheus_client>=0.20.0",
    "apache-airflow-providers-docker>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
analytics = [
    "duckdb>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Docker services)",
    "e2e: End-to-end tests (full pipeline execution)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.setuptools.packages.find]
include = ["ingestion*", "contracts*", "replay*", "monitoring*", "analytics*", "data_quality*"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
