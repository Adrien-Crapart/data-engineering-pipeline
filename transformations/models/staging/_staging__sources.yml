version: 2

sources:
  - name: openweather_raw
    description: >
      Raw weather data from OpenWeather API, ingested by DLT filesystem destination
      to MinIO S3 as Parquet files. Bronze layer of the medallion architecture.
      Path: s3://data-lake/raw/openweather/data/{table_name}/*.parquet
    tables:
      - name: weather_current
        description: Current weather observations per city from OpenWeather Current Weather API.
        meta:
          external_location: "read_parquet('s3://data-lake/raw/openweather/data/weather_current/*.parquet', hive_partitioning=false)"
      - name: weather_current__weather
        description: Weather condition details — DLT child table joined via _dlt_parent_id.
        meta:
          external_location: "read_parquet('s3://data-lake/raw/openweather/data/weather_current__weather/*.parquet', hive_partitioning=false)"
      - name: weather_forecast
        description: 5-day / 3-hour forecast parent data per city.
        meta:
          external_location: "read_parquet('s3://data-lake/raw/openweather/data/weather_forecast/*.parquet', hive_partitioning=false)"
      - name: weather_forecast__list
        description: Unnested forecast entries — DLT child table of weather_forecast.
        meta:
          external_location: "read_parquet('s3://data-lake/raw/openweather/data/weather_forecast__list/*.parquet', hive_partitioning=false)"
      - name: weather_forecast__list__weather
        description: Forecast weather conditions — DLT child table of forecast entries.
        meta:
          external_location: "read_parquet('s3://data-lake/raw/openweather/data/weather_forecast__list__weather/*.parquet', hive_partitioning=false)"
