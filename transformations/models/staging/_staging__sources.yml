version: 2

# Sources are now read directly from S3 Parquet via DuckDB read_parquet().
# This file documents the S3 data layout for reference.
# DLT filesystem destination writes normalized tables as Parquet files:
#   s3://weather-data-lake/raw/openweather/data/{table_name}/*.parquet
#
# Tables:
#   - weather_current              : Current weather observations per city
#   - weather_current__weather     : Weather condition details (DLT child table)
#   - weather_forecast             : 5-day / 3-hour forecast data (parent)
#   - weather_forecast__list       : Unnested forecast entries (DLT child table)
#   - weather_forecast__list__weather : Forecast weather conditions (DLT child table)
#   - _dlt_loads                   : DLT load tracking metadata
#   - _dlt_pipeline_state          : DLT pipeline state
#   - _dlt_version                 : DLT schema version
