global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'

  routes:
    - receiver: 'critical'
      match:
        severity: critical
    - receiver: 'default'
      match:
        severity: warning

receivers:
  - name: 'default'
    webhook_configs: []

  - name: 'critical'
    webhook_configs: []

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
