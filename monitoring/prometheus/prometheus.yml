global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Airflow StatsD metrics via statsd-exporter
  - job_name: "airflow-statsd"
    static_configs:
      - targets: ["statsd-exporter:9102"]
        labels:
          service: "airflow"

  # Pipeline metrics via Pushgateway
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["prometheus-pushgateway:9091"]

  # Docker container metrics via docker-exporter
  - job_name: "docker"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["docker-exporter:9417"]
        labels:
          service: "docker"

  # Host metrics via node-exporter
  - job_name: "node-exporter"
    scrape_timeout: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host"

  # Loki health
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: "monitoring"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
